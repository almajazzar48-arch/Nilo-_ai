name: Build Nilo v0.5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nilo_ai_v05_fixed.zip'
      - '.github/workflows/build-v05.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unzip Nilo project
        run: |
          rm -rf nilo_build
          mkdir nilo_build
          unzip -q nilo_ai_v05_fixed.zip -d nilo_build
          test -f nilo_build/nilo_ai_v05/pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        working-directory: nilo_build/nilo_ai_v05
        run: |
          flutter create . \
            --platforms=android \
            --project-name=nilo_ai_v05 \
            --org=com.nilo.ai.v05

      - name: Get dependencies
        working-directory: nilo_build/nilo_ai_v05
        run: flutter pub get

      - name: Build APK
        working-directory: nilo_build/nilo_ai_v05
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nilo-v05-Android
          path: nilo_build/nilo_ai_v05/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
